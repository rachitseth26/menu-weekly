<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Weekly Menu Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F9F4EC;
    --ink: #1A1410;
    --brown: #5C3D2E;
    --terracotta: #C4623A;
    --gold: #D4A853;
    --muted: #9B8B7A;
    --white: #FFFFFF;
    --border: #E8DDD0;
    --wa: #25D366;
  }

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
background: var(–cream);
font-family: ‘DM Sans’, sans-serif;
color: var(–ink);
min-height: 100vh;
-webkit-text-size-adjust: 100%;
}

.container {
max-width: 900px;
margin: 0 auto;
padding: 0 16px 80px;
}

/* Header */
header {
text-align: center;
padding: 40px 0 24px;
}

.header-tag {
display: inline-block;
font-size: 11px;
letter-spacing: 0.18em;
text-transform: uppercase;
color: var(–terracotta);
font-weight: 500;
border: 1px solid var(–terracotta);
padding: 4px 14px;
border-radius: 20px;
margin-bottom: 14px;
}

h1 {
font-family: ‘Playfair Display’, serif;
font-size: clamp(1.9rem, 7vw, 3rem);
font-weight: 700;
color: var(–brown);
line-height: 1.2;
margin-bottom: 10px;
}

h1 em { font-style: italic; color: var(–terracotta); }

header p {
font-size: 14px;
color: var(–muted);
font-weight: 300;
}

/* Divider */
.divider {
display: flex;
align-items: center;
gap: 12px;
margin: 20px 0;
width: 100%;
}
.divider::before, .divider::after {
content: ‘’;
flex: 1;
height: 1px;
background: var(–border);
}
.divider span {
font-size: 14px;
color: var(–gold);
line-height: 1;
}

/* Notify bar */
.notify-bar {
background: var(–white);
border: 1.5px solid var(–border);
border-radius: 14px;
padding: 14px 16px;
margin-bottom: 20px;
}

.notify-label {
font-size: 11px;
font-weight: 500;
color: var(–muted);
text-transform: uppercase;
letter-spacing: 0.1em;
margin-bottom: 8px;
}

.phone-input {
width: 100%;
padding: 10px 14px;
border: 1.5px solid var(–border);
border-radius: 10px;
font-family: ‘DM Sans’, sans-serif;
font-size: 15px;
color: var(–ink);
background: var(–cream);
outline: none;
-webkit-appearance: none;
}

.phone-input:focus { border-color: var(–wa); }

/* Tabs */
.meal-tabs {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 8px;
margin-bottom: 20px;
}

.meal-tab {
padding: 10px 4px;
border-radius: 12px;
border: 1.5px solid var(–border);
background-color: var(–white);
font-family: ‘DM Sans’, sans-serif;
font-size: 12px;
font-weight: 500;
color: var(–muted);
cursor: pointer;
text-align: center;
-webkit-appearance: none;
appearance: none;
}

.meal-tab.active {
background-color: var(–brown) !important;
border-color: var(–brown) !important;
color: white !important;
}

/* Week grid */
.week-grid {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 8px;
margin-bottom: 24px;
}

@media (max-width: 600px) {
.week-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 380px) {
.week-grid { grid-template-columns: repeat(2, 1fr); }
}

.day-col { display: flex; flex-direction: column; gap: 6px; }

.day-header {
background-color: var(–brown);
border-radius: 10px;
padding: 8px 4px;
text-align: center;
}

.day-header.today { background-color: var(–terracotta) !important; }

.day-name {
font-size: 10px;
letter-spacing: 0.08em;
text-transform: uppercase;
color: rgba(255,255,255,0.75);
font-weight: 500;
display: block;
}

.day-date {
font-family: ‘Playfair Display’, serif;
font-size: 18px;
color: #FFFFFF;
font-weight: 700;
line-height: 1.2;
display: block;
}

.meal-slot {
background: var(–white);
border: 1.5px dashed var(–border);
border-radius: 10px;
min-height: 80px;
padding: 8px;
cursor: pointer;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
position: relative;
-webkit-tap-highlight-color: transparent;
}

.meal-slot.filled {
border-style: solid;
align-items: flex-start;
text-align: left;
justify-content: flex-start;
}

.slot-type {
font-size: 9px;
text-transform: uppercase;
letter-spacing: 0.1em;
color: var(–muted);
font-weight: 500;
margin-bottom: 3px;
}

.slot-plus {
font-size: 22px;
color: var(–border);
line-height: 1;
margin-bottom: 2px;
}

.slot-add-text { font-size: 10px; color: var(–muted); }

.slot-meal-name {
font-family: ‘Playfair Display’, serif;
font-size: 12px;
font-weight: 700;
color: var(–brown);
line-height: 1.3;
word-break: break-word;
}

.slot-remove {
position: absolute;
top: 4px;
right: 4px;
background: none;
border: none;
color: var(–muted);
font-size: 12px;
cursor: pointer;
padding: 2px 4px;
line-height: 1;
-webkit-appearance: none;
}

/* Stats */
.stats-bar {
background: var(–white);
border: 1.5px solid var(–border);
border-radius: 14px;
padding: 16px;
display: flex;
justify-content: space-between;
align-items: center;
gap: 12px;
flex-wrap: wrap;
}

.stats { display: flex; gap: 20px; }

.stat-num {
font-family: ‘Playfair Display’, serif;
font-size: 26px;
font-weight: 700;
color: var(–terracotta);
line-height: 1;
}

.stat-label {
font-size: 10px;
text-transform: uppercase;
letter-spacing: 0.08em;
color: var(–muted);
font-weight: 500;
margin-top: 2px;
}

.action-btns { display: flex; gap: 8px; }

.btn {
padding: 9px 16px;
border-radius: 10px;
font-family: ‘DM Sans’, sans-serif;
font-size: 13px;
font-weight: 500;
cursor: pointer;
border: none;
-webkit-appearance: none;
}

.btn-outline { background: transparent; color: var(–brown); border: 1.5px solid var(–border); }
.btn-primary { background: var(–terracotta); color: white; }

/* Modal — slides up from bottom on mobile */
.overlay {
display: none;
position: fixed;
inset: 0;
background: rgba(26,20,16,0.5);
z-index: 100;
align-items: flex-end;
justify-content: center;
}

.overlay.open { display: flex; }

.modal {
background: var(–cream);
border-radius: 24px 24px 0 0;
width: 100%;
max-width: 540px;
padding: 16px 20px 44px;
animation: slideUp 0.22s ease;
}

@keyframes slideUp {
from { transform: translateY(100%); opacity: 0; }
to { transform: translateY(0); opacity: 1; }
}

.modal-handle {
width: 36px;
height: 4px;
background: var(–border);
border-radius: 2px;
margin: 0 auto 18px;
}

.modal-title {
font-family: ‘Playfair Display’, serif;
font-size: 20px;
font-weight: 700;
color: var(–brown);
margin-bottom: 4px;
}

.modal-subtitle {
font-size: 13px;
color: var(–muted);
margin-bottom: 18px;
}

.meal-input {
width: 100%;
padding: 14px 16px;
border: 1.5px solid var(–border);
border-radius: 12px;
background: var(–white);
font-family: ‘Playfair Display’, serif;
font-size: 17px;
color: var(–ink);
outline: none;
margin-bottom: 6px;
-webkit-appearance: none;
display: block;
}

.meal-input:focus { border-color: var(–terracotta); }
.meal-input::placeholder { color: #CCC; font-style: italic; }

.input-hint { font-size: 12px; color: var(–muted); margin-bottom: 14px; }

.add-btn {
width: 100%;
padding: 14px;
background: var(–terracotta);
color: white;
border: none;
border-radius: 12px;
font-family: ‘DM Sans’, sans-serif;
font-size: 15px;
font-weight: 500;
cursor: pointer;
margin-bottom: 12px;
-webkit-appearance: none;
display: block;
}

.add-btn:disabled { background: var(–border); }

.sep {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 12px;
font-size: 11px;
color: var(–muted);
text-transform: uppercase;
letter-spacing: 0.08em;
}
.sep::before, .sep::after { content: ‘’; flex: 1; height: 1px; background: var(–border); }

.wa-btn {
width: 100%;
padding: 14px;
background: var(–wa);
color: white;
border: none;
border-radius: 12px;
font-family: ‘DM Sans’, sans-serif;
font-size: 15px;
font-weight: 500;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
text-decoration: none;
-webkit-appearance: none;
}

.wa-btn.off { background: var(–border); pointer-events: none; }

/* Toast */
.toast {
position: fixed;
bottom: 24px;
left: 50%;
transform: translateX(-50%) translateY(60px);
background: var(–ink);
color: white;
padding: 11px 22px;
border-radius: 30px;
font-size: 13px;
font-weight: 500;
z-index: 200;
transition: transform 0.25s ease;
pointer-events: none;
white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); }
</style>

</head>
<body>
<div class="container">

  <header>
    <div class="header-tag">✦ Weekly Planner</div>
    <h1>Plan Your Week,<br><em>One Meal at a Time</em></h1>
    <p>Tap any slot to add a meal for the day.</p>
  </header>

  <div class="divider"><span>✦</span></div>

  <div class="notify-bar">
    <div class="notify-label">💬 WhatsApp notification number</div>
    <input class="phone-input" type="tel" id="waPhone" placeholder="+1 234 567 8900">
  </div>

  <div class="meal-tabs" id="mealTabs">
    <button class="meal-tab active" data-meal="Breakfast">🌅 Breakfast</button>
    <button class="meal-tab" data-meal="Lunch">☀️ Lunch</button>
    <button class="meal-tab" data-meal="Dinner">🌙 Dinner</button>
    <button class="meal-tab" data-meal="Snack">🍎 Snack</button>
  </div>

  <div class="week-grid" id="weekGrid"></div>

  <div class="stats-bar">
    <div class="stats">
      <div>
        <div class="stat-num" id="totalMeals">0</div>
        <div class="stat-label">Planned</div>
      </div>
      <div>
        <div class="stat-num" id="daysCount">0</div>
        <div class="stat-label">Days</div>
      </div>
      <div>
        <div class="stat-num" id="emptyCount">28</div>
        <div class="stat-label">Empty</div>
      </div>
    </div>
    <div class="action-btns">
      <button class="btn btn-outline" onclick="clearAll()">Clear</button>
      <button class="btn btn-primary" onclick="window.print()">Print</button>
    </div>
  </div>

</div>

<!-- Modal -->

<div class="overlay" id="overlay" onclick="onOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Breakfast — Mon</div>
    <div class="modal-subtitle" id="modalSub">What's for breakfast?</div>
    <input class="meal-input" id="mealInput" type="text" placeholder="e.g. Avocado toast…" maxlength="80"
      oninput="onInput()" onkeydown="if(event.key==='Enter')addMeal()">
    <div class="input-hint">Type a meal name and tap Add</div>
    <button class="add-btn" id="addBtn" onclick="addMeal()" disabled>Add to menu</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const DAYS  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const TYPES = ['Breakfast','Lunch','Dinner','Snack'];

  const schedule = JSON.parse(localStorage.getItem('menuSchedule') || '{}');
  let activeType   = 'Breakfast';
  let currentSlot  = null;

  // Restore phone
  const ph = document.getElementById('waPhone');
  ph.value = localStorage.getItem('menuPhone') || '';
  ph.addEventListener('input', () => {
    localStorage.setItem('menuPhone', ph.value);
  });

  // Tabs
  document.getElementById('mealTabs').addEventListener('click', e => {
    const btn = e.target.closest('.meal-tab');
    if (!btn) return;
    document.querySelectorAll('.meal-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeType = btn.dataset.meal;
    renderGrid();
  });

  function renderGrid() {
    const today    = new Date().getDay();
    const todayIdx = today === 0 ? 6 : today - 1;
    const grid     = document.getElementById('weekGrid');
    grid.innerHTML = '';

    DAYS.forEach((day, i) => {
      const col = document.createElement('div');
      col.className = 'day-col';

      const d = new Date();
      d.setDate(d.getDate() + (i - todayIdx));

      const hdr = document.createElement('div');
      hdr.className = 'day-header' + (i === todayIdx ? ' today' : '');
      hdr.innerHTML = `<div class="day-name">${day}</div><div class="day-date">${d.getDate()}</div>`;
      col.appendChild(hdr);

      const key  = `${day}-${activeType}`;
      const meal = schedule[key];
      const slot = document.createElement('div');
      slot.className = 'meal-slot' + (meal ? ' filled' : '');

      if (meal) {
        slot.innerHTML = `
          <button class="slot-remove" onclick="removeMeal(event,'${key}')">✕</button>
          <div class="slot-type">${activeType}</div>
          <div class="slot-meal-name">${meal.name}</div>`;
      } else {
        slot.innerHTML = `
          <div class="slot-type">${activeType}</div>
          <div class="slot-plus">+</div>
          <div class="slot-add-text">Add</div>`;
      }

      slot.addEventListener('click', e => {
        if (e.target.classList.contains('slot-remove')) return;
        openModal(day, activeType);
      });

      col.appendChild(slot);
      grid.appendChild(col);
    });

    updateStats();
  }

  function openModal(day, type) {
    currentSlot = { day, type };
    const existing = schedule[`${day}-${type}`];
    document.getElementById('modalTitle').textContent = `${type} — ${day}`;
    document.getElementById('modalSub').textContent   = existing ? 'Edit or replace this meal' : `What's for ${type.toLowerCase()}?`;
    const inp = document.getElementById('mealInput');
    inp.value = existing ? existing.name : '';
    document.getElementById('addBtn').disabled = !inp.value.trim();
    document.getElementById('overlay').classList.add('open');
    setTimeout(() => inp.focus(), 120);
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
    currentSlot = null;
  }

  function onOverlayClick(e) {
    if (e.target === document.getElementById('overlay')) closeModal();
  }

  function onInput() {
    const val = document.getElementById('mealInput').value.trim();
    document.getElementById('addBtn').disabled = !val;
  }

  function addMeal() {
    const val = document.getElementById('mealInput').value.trim();
    if (!val || !currentSlot) return;
    const { day, type } = currentSlot;
    schedule[`${day}-${type}`] = { name: val };
    localStorage.setItem('menuSchedule', JSON.stringify(schedule));

    // Auto-send WhatsApp if phone is set
    const phone = ph.value.trim().replace(/[\s\-\(\)]/g, '');
    if (phone) {
      const appUrl = window.location.href;
      const msg = encodeURIComponent(`🍽️ Meal update!\n\n*${type}* on *${day}*:\n👉 ${val}\n\n📅 View the full menu here:\n${appUrl}`);
      window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
    }

    closeModal();
    renderGrid();
    showToast(`Added: ${val}`);
  }

  function removeMeal(e, key) {
    e.stopPropagation();
    delete schedule[key];
    localStorage.setItem('menuSchedule', JSON.stringify(schedule));
    renderGrid();
    showToast('Meal removed');
  }

  function clearAll() {
    if (!Object.keys(schedule).length) return;
    Object.keys(schedule).forEach(k => delete schedule[k]);
    localStorage.setItem('menuSchedule', JSON.stringify(schedule));
    renderGrid();
    showToast('Menu cleared');
  }

  function updateStats() {
    const total = Object.keys(schedule).length;
    const days  = DAYS.filter(d => TYPES.some(t => schedule[`${d}-${t}`])).length;
    document.getElementById('totalMeals').textContent = total;
    document.getElementById('daysCount').textContent  = days;
    document.getElementById('emptyCount').textContent = (DAYS.length * TYPES.length) - total;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  renderGrid();
</script>

</body>
</html>
