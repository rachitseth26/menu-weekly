<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Weekly Menu Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

html, body {
background: #F9F4EC;
font-family: ‘DM Sans’, sans-serif;
color: #1A1410;
min-height: 100vh;
-webkit-text-size-adjust: 100%;
}

.container { max-width: 900px; margin: 0 auto; padding: 0 16px 80px; }

/* Header */
header { text-align: center; padding: 36px 0 20px; }

.header-tag {
display: inline-block;
font-size: 11px;
letter-spacing: 0.18em;
text-transform: uppercase;
color: #C4623A;
font-weight: 500;
border: 1px solid #C4623A;
padding: 4px 14px;
border-radius: 20px;
margin-bottom: 12px;
}

h1 {
font-family: ‘Playfair Display’, serif;
font-size: clamp(1.8rem, 7vw, 2.8rem);
font-weight: 700;
color: #5C3D2E;
line-height: 1.2;
margin-bottom: 8px;
}

h1 em { font-style: italic; color: #C4623A; }

header p { font-size: 14px; color: #9B8B7A; font-weight: 300; }

/* Divider */
.divider {
display: flex;
align-items: center;
gap: 12px;
margin: 18px 0;
}
.divider::before, .divider::after {
content: ‘’;
flex: 1;
height: 1px;
background: #E8DDD0;
}
.divider-star { font-size: 14px; color: #D4A853; }

/* Notify bar */
.notify-bar {
background: #FFFFFF;
border: 1.5px solid #E8DDD0;
border-radius: 14px;
padding: 14px 16px;
margin-bottom: 16px;
}

.notify-label {
font-size: 11px;
font-weight: 500;
color: #9B8B7A;
text-transform: uppercase;
letter-spacing: 0.1em;
margin-bottom: 8px;
}

.phone-input {
width: 100%;
padding: 10px 14px;
border: 1.5px solid #E8DDD0;
border-radius: 10px;
font-family: ‘DM Sans’, sans-serif;
font-size: 15px;
color: #1A1410;
background: #F9F4EC;
outline: none;
-webkit-appearance: none;
appearance: none;
}

/* Tabs — using divs not buttons */
.meal-tabs {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 8px;
margin-bottom: 16px;
}

.meal-tab {
padding: 10px 4px;
border-radius: 12px;
border: 1.5px solid #E8DDD0;
background: #FFFFFF;
font-family: ‘DM Sans’, sans-serif;
font-size: 12px;
font-weight: 500;
color: #9B8B7A;
cursor: pointer;
text-align: center;
user-select: none;
-webkit-user-select: none;
transition: none;
}

/* Week grid */
.week-grid {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 8px;
margin-bottom: 20px;
}

@media (max-width: 600px) {
.week-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 380px) {
.week-grid { grid-template-columns: repeat(2, 1fr); }
}

.day-col { display: flex; flex-direction: column; gap: 6px; }

/* Day header — background set inline in JS */
.day-header {
border-radius: 10px;
padding: 8px 4px;
text-align: center;
}

.day-name {
font-size: 10px;
letter-spacing: 0.08em;
text-transform: uppercase;
color: rgba(255,255,255,0.8);
font-weight: 500;
display: block;
}

.day-date {
font-family: ‘Playfair Display’, serif;
font-size: 18px;
color: #FFFFFF;
font-weight: 700;
line-height: 1.2;
display: block;
}

/* Meal slot */
.meal-slot {
background: #FFFFFF;
border: 1.5px dashed #E8DDD0;
border-radius: 10px;
min-height: 80px;
padding: 8px;
cursor: pointer;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
position: relative;
-webkit-tap-highlight-color: transparent;
}

.meal-slot.filled {
border-style: solid;
align-items: flex-start;
text-align: left;
justify-content: flex-start;
}

.slot-type {
font-size: 9px;
text-transform: uppercase;
letter-spacing: 0.1em;
color: #9B8B7A;
font-weight: 500;
margin-bottom: 3px;
display: block;
}

.slot-plus { font-size: 22px; color: #E8DDD0; line-height: 1; margin-bottom: 2px; display: block; }
.slot-add-text { font-size: 10px; color: #9B8B7A; display: block; }

.slot-meal-name {
font-family: ‘Playfair Display’, serif;
font-size: 12px;
font-weight: 700;
color: #5C3D2E;
line-height: 1.3;
word-break: break-word;
display: block;
}

.slot-remove {
position: absolute;
top: 4px; right: 4px;
background: none;
border: none;
color: #9B8B7A;
font-size: 13px;
cursor: pointer;
padding: 4px 6px;
line-height: 1;
-webkit-appearance: none;
}

/* Stats bar */
.stats-bar {
background: #FFFFFF;
border: 1.5px solid #E8DDD0;
border-radius: 14px;
padding: 16px;
display: flex;
justify-content: space-between;
align-items: center;
gap: 12px;
flex-wrap: wrap;
}

.stats { display: flex; gap: 20px; }

.stat-num {
font-family: ‘Playfair Display’, serif;
font-size: 26px;
font-weight: 700;
color: #C4623A;
line-height: 1;
}

.stat-label {
font-size: 10px;
text-transform: uppercase;
letter-spacing: 0.08em;
color: #9B8B7A;
font-weight: 500;
margin-top: 2px;
}

.action-btns { display: flex; gap: 8px; }

.btn {
padding: 9px 16px;
border-radius: 10px;
font-family: ‘DM Sans’, sans-serif;
font-size: 13px;
font-weight: 500;
cursor: pointer;
-webkit-appearance: none;
appearance: none;
}

.btn-clear {
background: transparent;
color: #5C3D2E;
border: 1.5px solid #E8DDD0;
}

.btn-print {
background: #C4623A;
color: #FFFFFF;
border: none;
}

/* Overlay + modal */
.overlay {
display: none;
position: fixed;
inset: 0;
background: rgba(26,20,16,0.5);
z-index: 100;
align-items: flex-end;
justify-content: center;
}

.overlay.open { display: flex; }

.modal {
background: #F9F4EC;
border-radius: 24px 24px 0 0;
width: 100%;
max-width: 540px;
padding: 16px 20px 48px;
animation: slideUp 0.22s ease;
}

@keyframes slideUp {
from { transform: translateY(100%); opacity: 0; }
to   { transform: translateY(0);    opacity: 1; }
}

.modal-handle {
width: 36px; height: 4px;
background: #E8DDD0;
border-radius: 2px;
margin: 0 auto 18px;
}

.modal-title {
font-family: ‘Playfair Display’, serif;
font-size: 20px;
font-weight: 700;
color: #5C3D2E;
margin-bottom: 4px;
}

.modal-sub { font-size: 13px; color: #9B8B7A; margin-bottom: 18px; }

.meal-input {
width: 100%;
padding: 14px 16px;
border: 1.5px solid #E8DDD0;
border-radius: 12px;
background: #FFFFFF;
font-family: ‘Playfair Display’, serif;
font-size: 17px;
color: #1A1410;
outline: none;
margin-bottom: 6px;
-webkit-appearance: none;
appearance: none;
display: block;
}

.meal-input:focus { border-color: #C4623A; }
.meal-input::placeholder { color: #CCC; font-style: italic; }

.input-hint { font-size: 12px; color: #9B8B7A; margin-bottom: 14px; }

.add-btn {
width: 100%;
padding: 15px;
background: #C4623A;
color: #FFFFFF;
border: none;
border-radius: 12px;
font-family: ‘DM Sans’, sans-serif;
font-size: 15px;
font-weight: 500;
cursor: pointer;
-webkit-appearance: none;
appearance: none;
display: block;
}

.add-btn:disabled { background: #E8DDD0; color: #9B8B7A; }

/* Toast */
.toast {
position: fixed;
bottom: 24px; left: 50%;
transform: translateX(-50%) translateY(60px);
background: #1A1410;
color: #FFFFFF;
padding: 11px 22px;
border-radius: 30px;
font-size: 13px;
font-weight: 500;
z-index: 200;
transition: transform 0.25s ease;
pointer-events: none;
white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); }
</style>

</head>
<body>
<div class="container">

  <header>
    <div class="header-tag">✦ Weekly Planner</div>
    <h1>Plan Your Week,<br><em>One Meal at a Time</em></h1>
    <p>Tap any slot to add a meal for the day.</p>
  </header>

  <div class="divider"><span class="divider-star">✦</span></div>

  <div class="notify-bar">
    <div class="notify-label">💬 WhatsApp notification number</div>
    <input class="phone-input" type="tel" id="waPhone" placeholder="+1 234 567 8900">
  </div>

  <div class="meal-tabs" id="mealTabs">
    <div class="meal-tab" data-meal="Breakfast">🌅 Breakfast</div>
    <div class="meal-tab" data-meal="Lunch">☀️ Lunch</div>
    <div class="meal-tab" data-meal="Dinner">🌙 Dinner</div>
    <div class="meal-tab" data-meal="Snack">🍎 Snack</div>
  </div>

  <div class="week-grid" id="weekGrid"></div>

  <div class="stats-bar">
    <div class="stats">
      <div>
        <div class="stat-num" id="totalMeals">0</div>
        <div class="stat-label">Planned</div>
      </div>
      <div>
        <div class="stat-num" id="daysCount">0</div>
        <div class="stat-label">Days</div>
      </div>
      <div>
        <div class="stat-num" id="emptyCount">28</div>
        <div class="stat-label">Empty</div>
      </div>
    </div>
    <div class="action-btns">
      <button class="btn btn-clear" onclick="clearAll()">Clear</button>
      <button class="btn btn-print" onclick="window.print()">Print</button>
    </div>
  </div>

</div>

<!-- Modal -->

<div class="overlay" id="overlay" onclick="onOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Breakfast — Mon</div>
    <div class="modal-sub" id="modalSub">What's for breakfast?</div>
    <input class="meal-input" id="mealInput" type="text"
      placeholder="e.g. Avocado toast…" maxlength="80"
      oninput="onInput()" onkeydown="if(event.key==='Enter')addMeal()">
    <div class="input-hint">Type a meal name and tap Add</div>
    <button class="add-btn" id="addBtn" onclick="addMeal()" disabled>Add to menu</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const DAYS  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const TYPES = ['Breakfast','Lunch','Dinner','Snack'];
  const BROWN      = '#5C3D2E';
  const TERRACOTTA = '#C4623A';

  const schedule = JSON.parse(localStorage.getItem('menuSchedule') || '{}');
  let activeType  = 'Breakfast';
  let currentSlot = null;

  // Restore phone
  const ph = document.getElementById('waPhone');
  ph.value = localStorage.getItem('menuPhone') || '';
  ph.addEventListener('input', () => localStorage.setItem('menuPhone', ph.value));

  // Set first tab active on load
  setActiveTab('Breakfast');

  // Tabs — divs with click
  document.getElementById('mealTabs').addEventListener('click', e => {
    const tab = e.target.closest('.meal-tab');
    if (!tab) return;
    setActiveTab(tab.dataset.meal);
    activeType = tab.dataset.meal;
    renderGrid();
  });

  function setActiveTab(meal) {
    document.querySelectorAll('.meal-tab').forEach(t => {
      const isActive = t.dataset.meal === meal;
      t.style.background    = isActive ? BROWN : '#FFFFFF';
      t.style.borderColor   = isActive ? BROWN : '#E8DDD0';
      t.style.color         = isActive ? '#FFFFFF' : '#9B8B7A';
    });
  }

  function renderGrid() {
    const today    = new Date().getDay();
    const todayIdx = today === 0 ? 6 : today - 1;
    const grid     = document.getElementById('weekGrid');
    grid.innerHTML = '';

    DAYS.forEach((day, i) => {
      const col = document.createElement('div');
      col.className = 'day-col';

      const d = new Date();
      d.setDate(d.getDate() + (i - todayIdx));

      // Day header — background set inline
      const hdr = document.createElement('div');
      hdr.className = 'day-header';
      hdr.style.background = (i === todayIdx) ? TERRACOTTA : BROWN;
      hdr.innerHTML = `<span class="day-name">${day}</span><span class="day-date">${d.getDate()}</span>`;
      col.appendChild(hdr);

      // Meal slot
      const key  = `${day}-${activeType}`;
      const meal = schedule[key];
      const slot = document.createElement('div');
      slot.className = 'meal-slot' + (meal ? ' filled' : '');

      if (meal) {
        slot.innerHTML = `
          <button class="slot-remove" onclick="removeMeal(event,'${key}')">✕</button>
          <span class="slot-type">${activeType}</span>
          <span class="slot-meal-name">${meal.name}</span>`;
      } else {
        slot.innerHTML = `
          <span class="slot-type">${activeType}</span>
          <span class="slot-plus">+</span>
          <span class="slot-add-text">Add</span>`;
      }

      slot.addEventListener('click', e => {
        if (e.target.classList.contains('slot-remove')) return;
        openModal(day, activeType);
      });

      col.appendChild(slot);
      grid.appendChild(col);
    });

    updateStats();
  }

  function openModal(day, type) {
    currentSlot = { day, type };
    const existing = schedule[`${day}-${type}`];
    document.getElementById('modalTitle').textContent = `${type} — ${day}`;
    document.getElementById('modalSub').textContent   = existing ? 'Edit or replace this meal' : `What's for ${type.toLowerCase()}?`;
    const inp = document.getElementById('mealInput');
    inp.value = existing ? existing.name : '';
    document.getElementById('addBtn').disabled = !inp.value.trim();
    document.getElementById('overlay').classList.add('open');
    setTimeout(() => inp.focus(), 120);
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
    currentSlot = null;
  }

  function onOverlayClick(e) {
    if (e.target === document.getElementById('overlay')) closeModal();
  }

  function onInput() {
    document.getElementById('addBtn').disabled = !document.getElementById('mealInput').value.trim();
  }

  function addMeal() {
    const val = document.getElementById('mealInput').value.trim();
    if (!val || !currentSlot) return;
    const { day, type } = currentSlot;
    schedule[`${day}-${type}`] = { name: val };
    localStorage.setItem('menuSchedule', JSON.stringify(schedule));

    // Auto WhatsApp
    const phone = ph.value.trim().replace(/[\s\-\(\)]/g, '');
    if (phone) {
      const appUrl = window.location.href;
      const msg = encodeURIComponent(`🍽️ Meal update!\n\n*${type}* on *${day}*:\n👉 ${val}\n\n📅 View the full menu:\n${appUrl}`);
      window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
    }

    closeModal();
    renderGrid();
    showToast(`Added: ${val}`);
  }

  function removeMeal(e, key) {
    e.stopPropagation();
    delete schedule[key];
    localStorage.setItem('menuSchedule', JSON.stringify(schedule));
    renderGrid();
    showToast('Meal removed');
  }

  function clearAll() {
    if (!Object.keys(schedule).length) return;
    Object.keys(schedule).forEach(k => delete schedule[k]);
    localStorage.setItem('menuSchedule', JSON.stringify(schedule));
    renderGrid();
    showToast('Menu cleared');
  }

  function updateStats() {
    const total = Object.keys(schedule).length;
    const days  = DAYS.filter(d => TYPES.some(t => schedule[`${d}-${t}`])).length;
    document.getElementById('totalMeals').textContent = total;
    document.getElementById('daysCount').textContent  = days;
    document.getElementById('emptyCount').textContent = (DAYS.length * TYPES.length) - total;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  renderGrid();
</script>

</body>
</html>
